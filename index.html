<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Income & Expenses</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Income & Expenses</h1>
      <p>A simple record of what comes in and what goes out.</p>
    </header>

    <section class="summary" aria-label="Totals">
      <article class="stat">
        <h2>Income</h2>
        <p id="total-income" class="amount income">$0.00</p>
      </article>
      <article class="stat">
        <h2>Expenses</h2>
        <p id="total-expenses" class="amount expense">$0.00</p>
      </article>
      <article class="stat">
        <h2>Balance</h2>
        <p id="balance" class="amount">$0.00</p>
      </article>
    </section>

    <section class="panel">
      <h2 id="form-title">Add an entry</h2>
      <form id="entry-form">
        <label>
          Amount
          <input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0.00">
        </label>
        <label>
          Type
          <select id="type" name="type" required>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </label>
        <label>
          Category
          <input id="category" name="category" type="text" list="categories" maxlength="40" required placeholder="Salary, rent, food…">
          <datalist id="categories">
            <option value="Salary"></option>
            <option value="Freelance"></option>
            <option value="Rent"></option>
            <option value="Groceries"></option>
            <option value="Transport"></option>
            <option value="Utilities"></option>
            <option value="Dining"></option>
            <option value="Other"></option>
          </datalist>
        </label>
        <label>
          Date
          <input id="date" name="date" type="date" required>
        </label>
        <div class="form-actions">
          <button type="submit" id="submit-button">Add entry</button>
          <button type="button" id="cancel-edit" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="list-head">
        <h2>Entries</h2>
        <p id="entry-count">0 entries</p>
      </div>
      <p id="empty" class="empty">No entries yet. Add one above to get started.</p>
      <ul id="entries" class="entries"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
